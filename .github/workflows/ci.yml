name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main, 'devin/*']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, redis, bcmath, gd, intl, zip, sqlite3, pdo_sqlite
          coverage: none
      
      - name: Install Composer dependencies
        working-directory: ./app
        run: composer install --no-interaction --prefer-dist
      
      - name: Run Laravel Pint
        working-directory: ./app
        run: ./vendor/bin/pint --test
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install npm dependencies
        working-directory: ./app
        run: npm ci --legacy-peer-deps
      
      - name: Lint JavaScript
        working-directory: ./app
        run: npm run lint || echo "Lint not configured yet"

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, json, pdo_mysql, sqlite3, pdo_sqlite
          coverage: none
      
      - name: Install Composer dependencies
        working-directory: ./app
        run: composer install --no-interaction --prefer-dist
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install npm dependencies
        working-directory: ./app
        run: npm ci --legacy-peer-deps
      
      - name: Build assets
        working-directory: ./app
        run: npm run build
      
      - name: Copy .env
        working-directory: ./app
        run: cp .env.example .env
      
      - name: Generate application key
        working-directory: ./app
        run: php artisan key:generate
      
      - name: Prepare SQLite database
        working-directory: ./app
        run: mkdir -p database && touch database/database.sqlite
      
      - name: Run PHPUnit (quarantine excluded)
        working-directory: ./app
        run: vendor/bin/phpunit --colors=always

  dusk:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Composer deps
        working-directory: ./app
        run: composer install --no-interaction --no-progress

      - name: Build frontend
        working-directory: ./app
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Prepare Dusk env & DB
        working-directory: ./app
        run: |
          cp .env.example .env || true
          php artisan key:generate
          printf "%s\n" \
            "APP_ENV=testing" \
            "APP_DEBUG=true" \
            "APP_URL=http://127.0.0.1:8000" \
            "CACHE_STORE=array" \
            "SESSION_DRIVER=array" \
            "QUEUE_CONNECTION=sync" \
            "DB_CONNECTION=sqlite" \
            "DB_DATABASE=database/database.sqlite" \
            "E2E_USE_MOCKS=true" \
            "SETTINGS_TESTING_USE_MOCKS=true" \
            > .env.dusk.local
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --class=CurrenciesSeeder || true
          php artisan db:seed --class=DemoSeeder || true
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Start PHP server
        working-directory: ./app
        run: php -S 127.0.0.1:8000 -t public >/dev/null 2>&1 &

      - name: Run Dusk
        working-directory: ./app
        env:
          APP_URL: http://127.0.0.1:8000
          E2E_USE_MOCKS: true
          SETTINGS_TESTING_USE_MOCKS: true
        run: php artisan dusk --colors=always --debug

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, redis, bcmath, gd, intl, zip, sqlite3, pdo_sqlite
      
      - name: Setup Composer dependencies
        working-directory: ./app
        run: composer install --no-interaction --prefer-dist
      
      - name: Run PHPStan
        working-directory: ./app
        run: ./vendor/bin/phpstan analyze --error-format=github || true
      
      - name: Run Psalm
        working-directory: ./app
        run: ./vendor/bin/psalm --output-format=github --shepherd || true

  build-docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./deploy/Dockerfile
          push: false
          load: false
          tags: hubit:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: './app'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
