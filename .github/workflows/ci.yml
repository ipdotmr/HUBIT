name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, redis, bcmath, gd, intl, zip
          coverage: none
      
      - name: Install Composer dependencies
        working-directory: ./app
        run: composer install --no-interaction --prefer-dist
      
      - name: Run Laravel Pint
        working-directory: ./app
        run: ./vendor/bin/pint --test
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install npm dependencies
        working-directory: ./app
        run: npm ci --legacy-peer-deps
      
      - name: Lint JavaScript
        working-directory: ./app
        run: npm run lint || echo "Lint not configured yet"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hubit_test
          POSTGRES_USER: hubit
          POSTGRES_PASSWORD: hubit_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, redis, bcmath, gd, intl, zip
          coverage: xdebug
      
      - name: Install Composer dependencies
        working-directory: ./app
        run: composer install --no-interaction --prefer-dist
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install npm dependencies
        working-directory: ./app
        run: npm ci --legacy-peer-deps
      
      - name: Build assets
        working-directory: ./app
        run: npm run build
      
      - name: Copy .env
        working-directory: ./app
        run: cp .env.example .env
      
      - name: Generate application key
        working-directory: ./app
        run: php artisan key:generate
      
      - name: Run migrations
        working-directory: ./app
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: hubit_test
          DB_USERNAME: hubit
          DB_PASSWORD: hubit_test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: php artisan migrate --force
      
      - name: Run tests
        working-directory: ./app
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: hubit_test
          DB_USERNAME: hubit
          DB_PASSWORD: hubit_test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: php artisan test

  dusk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hubit_test
          POSTGRES_USER: hubit
          POSTGRES_PASSWORD: hubit_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, redis, bcmath, gd, intl, zip
      
      - name: Install Composer dependencies
        working-directory: ./app
        run: composer install --no-interaction --prefer-dist
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install npm dependencies
        working-directory: ./app
        run: npm ci --legacy-peer-deps
      
      - name: Build assets
        working-directory: ./app
        run: npm run build
      
      - name: Copy .env
        working-directory: ./app
        run: cp .env.example .env
      
      - name: Generate application key
        working-directory: ./app
        run: php artisan key:generate
      
      - name: Run migrations
        working-directory: ./app
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: hubit_test
          DB_USERNAME: hubit
          DB_PASSWORD: hubit_test_password
        run: php artisan migrate --force
      
      - name: Upgrade Chrome Driver
        working-directory: ./app
        run: php artisan dusk:chrome-driver --detect || echo "Dusk not configured yet"
      
      - name: Start Chrome Driver
        working-directory: ./app
        run: ./vendor/laravel/dusk/bin/chromedriver-linux &
      
      - name: Run Laravel Server
        working-directory: ./app
        run: php artisan serve --no-reload &
      
      - name: Run Dusk Tests
        working-directory: ./app
        env:
          APP_URL: http://localhost:8000
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: hubit_test
          DB_USERNAME: hubit
          DB_PASSWORD: hubit_test_password
        run: php artisan dusk || echo "Dusk tests not ready yet"

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, redis, bcmath, gd, intl, zip
      
      - name: Install Composer dependencies
        working-directory: ./app
        run: composer install --no-interaction --prefer-dist
      
      - name: Run PHPStan
        working-directory: ./app
        run: ./vendor/bin/phpstan analyze || echo "PHPStan not configured yet"
      
      - name: Run Psalm
        working-directory: ./app
        run: ./vendor/bin/psalm || echo "Psalm not configured yet"

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./deploy/Dockerfile
          push: false
          tags: hubit:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
