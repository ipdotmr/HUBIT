name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main, 'devin/*']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: actions/setup-php@v5
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, json, pdo_mysql, sqlite3, pdo_sqlite, zip

      - name: Authenticate Composer with GitHub token
        run: composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Validate composer.json
        working-directory: ./app
        run: composer validate --no-ansi --strict

      - name: Install Composer dependencies
        working-directory: ./app
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: ./app
        run: npm ci --legacy-peer-deps

      - name: Run Laravel Pint
        working-directory: ./app
        run: ./vendor/bin/pint --test

      - name: Lint JavaScript
        working-directory: ./app
        run: npm run lint || echo "Lint not configured yet"

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: actions/setup-php@v5
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, json, pdo_mysql, sqlite3, pdo_sqlite

      - name: Authenticate Composer with GitHub token
        run: composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Validate composer.json
        working-directory: ./app
        run: composer validate --no-ansi --strict

      - name: Install Composer dependencies
        working-directory: ./app
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: ./app
        run: npm ci --legacy-peer-deps

      - name: Build assets
        working-directory: ./app
        run: npm run build

      - name: Copy .env
        working-directory: ./app
        run: cp .env.example .env

      - name: Generate application key
        working-directory: ./app
        run: php artisan key:generate

      - name: Prepare SQLite database
        working-directory: ./app
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run PHPUnit (quarantine excluded)
        working-directory: ./app
        run: vendor/bin/phpunit --colors=always

  dusk:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: actions/setup-php@v5
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, sqlite3, pdo_sqlite

      - name: Authenticate Composer with GitHub token
        run: composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Validate composer.json
        working-directory: ./app
        run: composer validate --no-ansi --strict

      - name: Install Composer dependencies
        working-directory: ./app
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./app
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: ./app
        run: npm run build

      - name: Prepare Dusk environment
        working-directory: ./app
        run: |
          cp .env.dusk .env
          if [ -f .env.dusk.local.example ]; then cp .env.dusk.local.example .env.dusk.local; fi
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class=CurrenciesSeeder || true
          php artisan db:seed --class=DemoSeeder || true
          php artisan config:clear

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Start PHP server
        working-directory: ./app
        run: php -S 127.0.0.1:8000 -t public >/dev/null 2>&1 &

      - name: Health check
        working-directory: ./app
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000 && break; sleep 1; done

      - name: Install matching ChromeDriver & start it
        working-directory: ./app
        run: |
          php artisan dusk:chrome-driver --detect
          chmod +x vendor/laravel/dusk/bin/chromedriver-linux
          echo "CHROMEWEBDRIVER=$(pwd)/vendor/laravel/dusk/bin" >> $GITHUB_ENV
          echo "DUSK_DRIVER_PATH=$(pwd)/vendor/laravel/dusk/bin/chromedriver-linux" >> $GITHUB_ENV
          echo "$(pwd)/vendor/laravel/dusk/bin" >> $GITHUB_PATH
          nohup vendor/laravel/dusk/bin/chromedriver-linux --port=9515 > /dev/null 2>&1 &

      - name: Run Dusk
        working-directory: ./app
        run: php artisan dusk --without-tty --colors=always || (sleep 3 && php artisan dusk --without-tty --colors=always)

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: actions/setup-php@v5
        with:
          php-version: '8.2'
          extensions: pgsql, redis, bcmath, gd, intl, zip, sqlite3, pdo_sqlite

      - name: Authenticate Composer with GitHub token
        run: composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Validate composer.json
        working-directory: ./app
        run: composer validate --no-ansi --strict

      - name: Install Composer dependencies
        working-directory: ./app
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        working-directory: ./app
        run: ./vendor/bin/phpstan analyze --error-format=github || true

      - name: Run Psalm
        working-directory: ./app
        run: ./vendor/bin/psalm --output-format=github --shepherd || true

  build-docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./deploy/Dockerfile
          push: false
          load: false
          tags: hubit:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: './app'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
