name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main, 'devin/*']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, sqlite, dom, curl, json, openssl
          coverage: none

      - name: Configure Composer auth for GitHub
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: |
          composer config -g github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "ssh://"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate & Install deps
        working-directory: ./app
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
          COMPOSER_NO_INTERACTION: 1
        run: |
          composer validate --no-check-all
          composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Run Laravel Pint
        working-directory: ./app
        run: ./vendor/bin/pint --test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: ./app
        run: npm ci --legacy-peer-deps

      - name: Lint JavaScript
        working-directory: ./app
        run: npm run lint || echo "Lint not configured yet"

  tests:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, sqlite, dom, curl, json, openssl
          coverage: none

      - name: Configure Composer auth for GitHub
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: |
          composer config -g github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "ssh://"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate & Install deps
        working-directory: ./app
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
          COMPOSER_NO_INTERACTION: 1
        run: |
          composer validate --no-check-all
          composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: ./app
        run: npm ci --legacy-peer-deps

      - name: Build assets
        working-directory: ./app
        run: npm run build

      - name: Copy .env
        working-directory: ./app
        run: cp .env.example .env

      - name: Generate application key
        working-directory: ./app
        run: php artisan key:generate

      - name: Prepare SQLite database
        working-directory: ./app
        run: mkdir -p database && touch database/database.sqlite

      - name: Run PHPUnit
        working-directory: ./app
        run: vendor/bin/phpunit --colors=always

  sast:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, sqlite, dom, curl, json, openssl

      - name: Configure Composer auth for GitHub
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: |
          composer config -g github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "ssh://"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate & Install deps
        working-directory: ./app
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
          COMPOSER_NO_INTERACTION: 1
        run: |
          composer validate --no-check-all
          composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        working-directory: ./app
        run: ./vendor/bin/phpstan analyze --error-format=github || true

      - name: Run Psalm
        working-directory: ./app
        run: ./vendor/bin/psalm --output-format=github --shepherd || true

  dusk:
    runs-on: ubuntu-latest
    needs: [tests]
    continue-on-error: true
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, sqlite, dom, curl, json, openssl
          coverage: none

      - name: Configure Composer auth for GitHub
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: |
          composer config -g github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "ssh://"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate & Install deps
        working-directory: ./app
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
          COMPOSER_NO_INTERACTION: 1
        run: |
          composer validate --no-check-all
          composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Build frontend
        working-directory: ./app
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Prepare Dusk environment
        working-directory: ./app
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1:8000
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          DUSK_DRIVER_URL: http://127.0.0.1:9515
          E2E_USE_MOCKS: true
          SETTINGS_TESTING_USE_MOCKS: true
        run: |
          cp .env.example .env || true
          cp ../.env.dusk .env.dusk
          php artisan key:generate --env=testing || true
          mkdir -p database
          touch database/database.sqlite
          php artisan config:clear
          php artisan cache:clear

      - name: Start PHP server
        working-directory: ./app
        run: php -S 127.0.0.1:8000 -t public >/dev/null 2>&1 &

      - name: Health check
        run: |
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000 && break; sleep 1; done

      - name: Install matching ChromeDriver & start it
        working-directory: ./app
        run: |
          php artisan dusk:chrome-driver --detect
          chmod +x vendor/laravel/dusk/bin/chromedriver-linux
          echo "CHROMEWEBDRIVER=$(pwd)/vendor/laravel/dusk/bin" >> $GITHUB_ENV
          echo "DUSK_DRIVER_PATH=$(pwd)/vendor/laravel/dusk/bin/chromedriver-linux" >> $GITHUB_ENV
          echo "$(pwd)/vendor/laravel/dusk/bin" >> $GITHUB_PATH
          nohup vendor/laravel/dusk/bin/chromedriver-linux --port=9515 > /dev/null 2>&1 &

      - name: Run Dusk (retry once)
        working-directory: ./app
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1:8000
          E2E_USE_MOCKS: true
          SETTINGS_TESTING_USE_MOCKS: true
        run: php artisan dusk --without-tty --colors=always --configuration=../phpunit.dusk.xml || (sleep 3 && php artisan dusk --without-tty --colors=always --configuration=../phpunit.dusk.xml)

  docker-trivy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./deploy/Dockerfile
          push: false
          load: false
          tags: hubit:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: './app'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
