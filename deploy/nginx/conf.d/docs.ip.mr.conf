# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name docs.ip.mr;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Documentation Site
server {
    listen 443 ssl http2;
    server_name docs.ip.mr;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/docs.ip.mr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/docs.ip.mr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/docs.ip.mr.access.log;
    error_log /var/log/nginx/docs.ip.mr.error.log;

    # Proxy to Docusaurus container
    location / {
        proxy_pass http://docs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://docs:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
